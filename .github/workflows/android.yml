name: Gerar APK (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (já vem no runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Instalar dependências
        run: npm install --no-save @supabase/supabase-js@2 esbuild @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Empacotar biblioteca do Supabase
        run: npm run vendor

      - name: Criar projeto Android
        run: npx cap add android

      - name: Ícone e tela de abertura
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#11100D' --iconBackgroundColorDark '#11100D' --splashBackgroundColor '#11100D' --splashBackgroundColorDark '#11100D'

      - name: Permissões de microfone e câmera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.microphone" android:required="false" />#' "$M"
          grep -n "permission\|uses-feature" "$M"

      - name: Versão do app
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" "$G"
          grep -n "versionCode\|versionName" "$G"

      - name: Chave de assinatura fixa (pra atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Copiar o app pra dentro do Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar APK pra baixar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Conselho.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk Conselho.apk \
            --title "Conselho para Android (versão 0.1.${{ github.run_number }})" \
            --notes "Baixe o arquivo **Conselho.apk** abaixo e instale no celular. Se o Android perguntar, permita instalar de fontes desconhecidas." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Conselho-apk
          path: Conselho.apk
